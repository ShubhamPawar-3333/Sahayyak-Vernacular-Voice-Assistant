[project]
name = "sahayyak"
version = "0.1.0"
description = "Vernacular Voice Assistant for Maharashtra Government Services"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Shubham Pawar"}
]
keywords = ["voice-assistant", "marathi", "llm", "rag", "langchain"]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | data
    | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 88
skip = [".git", ".venv", "data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=app --cov=modules --cov-report=term-missing"

[tool.coverage.run]
source = ["app", "modules"]
omit = ["tests/*", "*/__init__.py"]
